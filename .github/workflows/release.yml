# Android test release: run by hand (Actions → Release → Run workflow), enter a version like 0.2-test.
# Builds the app with the game files from gamedata/ and publishes it as a pre-release (private repo only).
name: Release
on:
  workflow_dispatch:
    inputs:
      version: { description: 'Version (z. B. 0.2-test)', required: true, default: '0.2-test' }
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: gradle -p android assembleDebug --no-daemon
      - name: create the release
        env: { GH_TOKEN: '${{ github.token }}', V: '${{ inputs.version }}' }
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "KelloggsLand-$V.apk"
          gh release create "v$V" "KelloggsLand-$V.apk" --target "$GITHUB_SHA" --prerelease \
            --title "Kellogg's Land $V (Android-Test)" --notes-file .github/release-notes.md
