# Builds the Android test app (WebView around web/, with the game files from gamedata/ if that folder is in the
# repo; internal testing only, private repo) and puts the installable APK (debug key) on the branch android-build.
name: Android
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', 'web/**', 'gamedata/**', '.github/workflows/android.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: gradle -p android assembleDebug --no-daemon
      - name: put the APK on branch android-build
        run: |
          mkdir out && cp android/app/build/outputs/apk/debug/app-debug.apk out/KelloggsLand-test.apk
          cd out && git init -q -b android-build && git add -A
          git -c user.name=brummilab -c user.email=brummilab@users.noreply.github.com commit -qm "Android test app ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" android-build
