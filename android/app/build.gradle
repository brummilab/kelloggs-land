plugins { id 'com.android.application' }
android {
    namespace 'at.brummilab.kelloggs'
    compileSdk 34
    defaultConfig {
        applicationId 'at.brummilab.kelloggs'
        minSdk 24
        targetSdk 34
        versionCode((project.findProperty('appCode') ?: '1') as int)
        versionName(project.findProperty('appVersion') ?: 'dev')
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    // the web version (web/) goes to assets/web (task copyWeb), the game files from gamedata/ (if the folder is
    // there) to assets/game with a list files.json (task copyGame); the page loads them itself (web/main.js, ?app=1)
    sourceSets { main { assets.srcDirs = ["$buildDir/webassets"] } }
}
dependencies { implementation 'androidx.webkit:webkit:1.11.0' }
tasks.register('copyWeb', Copy) {
    from("$rootDir/../web")
    into "$buildDir/webassets/web"
}
tasks.register('copyGame', Copy) {
    from("$rootDir/../gamedata") { exclude 'README.md' }
    into "$buildDir/webassets/game"
    doLast {
        def names = fileTree("$buildDir/webassets/game").files.collect { it.name }.findAll { it != 'files.json' }.sort()
        if (names) file("$buildDir/webassets/game/files.json").text = '[' + names.collect { '"' + it + '"' }.join(',') + ']'
    }
}
preBuild.dependsOn copyWeb, copyGame
